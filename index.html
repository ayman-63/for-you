<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}
body{
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
}
.stars{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(white 1px,transparent 1px);
background-size:40px 40px;
animation:moveStars 30s linear infinite;
opacity:.6;
}
@keyframes moveStars{
from{transform:translateY(0);}
to{transform:translateY(40px);}
}
.container{
text-align:center;
z-index:5;
color:white;
padding:20px;
}
.heart{
font-size:120px;
animation:beat 1s infinite;
filter:drop-shadow(0 0 20px red);
}
@keyframes beat{
0%,100%{transform:scale(1);}
50%{transform:scale(1.2);}
}
h1{
font-size:60px;
margin:20px 0;
text-shadow:0 0 20px hotpink;
}
p{
font-size:22px;
margin-bottom:30px;
opacity:.9;
}
button{
padding:16px 40px;
font-size:20px;
border:none;
border-radius:50px;
cursor:pointer;
background:#ff2d55;
color:white;
transition:.3s;
box-shadow:0 0 20px #ff2d55;
}
button:hover{
transform:scale(1.1);
box-shadow:0 0 40px #ff2d55;
}
.message{
margin-top:30px;
font-size:30px;
display:none;
animation:fade 1s;
color:#ffd6e7;
}
@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}
.floating-heart{
position:fixed;
font-size:22px;
animation:float 6s linear forwards;
pointer-events:none;
}
@keyframes float{
0%{
transform:translateY(0) scale(1);
opacity:1;
}
100%{
transform:translateY(-110vh) scale(2);
opacity:0;
}
}
</style>
</head>
<body>
<div class="stars"></div>
<div class="container">
<div class="heart">❤️</div>
<h1>I Love You</h1>
<p>You are the most beautiful part of my life.</p>
<button onclick="showLove()">Click Me ❤️</button>
<div class="message" id="msg">
Forever & Always ❤️<br>
I Love You More Every Day 💖
</div>
</div>
<script>
function showLove(){
document.getElementById("msg").style.display="block";
for(let i=0;i<80;i++){
setTimeout(createHeart,i*70);
}
}
function createHeart(){
const heart=document.createElement("div");
heart.className="floating-heart";
heart.innerHTML=["❤️","💖","💕","💘","💝"][Math.floor(Math.random()*5)];
heart.style.left=Math.random()*100+"vw";
heart.style.bottom="-30px";
heart.style.fontSize=(20+Math.random()*40)+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart,800);
</script>
</body>
</html>
