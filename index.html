<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',Arial,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top,#ff4d88,#1a0010 60%);
    color:white;
}

.container{
    width:90%;
    max-width:500px;
    text-align:center;
    padding:40px 25px;
    border-radius:30px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    box-shadow:0 0 40px rgba(255,0,100,.4);
}

.heart{
    font-size:110px;
    animation:heart 1.3s infinite;
}

@keyframes heart{
    50%{
        transform:scale(1.18);
    }
}

h1{
    font-size:65px;
    margin:20px 0;
    text-shadow:0 0 25px #ff9abb;
}

.text{
    font-size:22px;
    line-height:1.8;
}

button{
    margin-top:30px;
    padding:15px 40px;
    border:0;
    border-radius:50px;
    background:#ff2f68;
    color:white;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 0 25px #ff2f68;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
}

.particle{
    position:absolute;
    animation:move 6s linear forwards;
}

@keyframes move{

    from{
        transform:translateY(100vh) rotate(0);
        opacity:1;
    }

    to{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }

}

.loveText{
    font-size:50px;
    font-weight:bold;
    text-shadow:0 0 25px #ff9abb;
}

</style>

</head>


<body>


<div class="container">

<div class="heart">❤️</div>

<h1>For You ❤️</h1>


<div class="text">

There is something I've wanted to tell you for a long time...<br>
I tried to keep it to myself, but I felt I had to be honest with you.<br>
The truth is, I have a lot of feelings for you, and your presence means a lot to me ❤️<br>
I hope you feel something similar too.

</div>


<button onclick="love()">Open My Heart 💖</button>


</div>


<script>

function love(){

for(let i=0;i<80;i++){

let p=document.createElement("div");

p.className="particle";


let items=[
"❤️",
"💖",
"💕",
"✨"
];


p.innerHTML=items[Math.floor(Math.random()*items.length)];


p.style.left=Math.random()*100+"vw";

p.style.fontSize=(20+Math.random()*35)+"px";

p.style.animationDuration=(3+Math.random()*5)+"s";


document.body.appendChild(p);


setTimeout(()=>{

p.remove();

},7000);

}


// ظهور I LOVE YOU بشكل واضح

let love=document.createElement("div");

love.className="particle loveText";

love.innerHTML="I LOVE YOU ❤️";

love.style.left="50%";

love.style.top="50%";

love.style.transform="translate(-50%,-50%)";

love.style.animationDuration="5s";


document.body.appendChild(love);


setTimeout(()=>{

love.remove();

},5000);

}

</script>


</body>
</html>
